name: Setup
description: Install Bun and workspace dependencies with a cached Bun store.

inputs:
  install-args:
    description: Extra arguments for bun install.
    default: ""

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2

    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - shell: bash
      run: bun install --frozen-lockfile ${{ inputs.install-args }}
